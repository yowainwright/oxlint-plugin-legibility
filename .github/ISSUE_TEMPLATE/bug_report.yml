name: Bug Report
description: Report incorrect lint behavior, crashes, or packaging problems.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest code sample, config, and command that reproduces the issue.
      render: ts
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Oxlint Config
      description: Paste the relevant plugin config and rule options.
      render: js
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include oxlint-plugin-legibility, Oxlint, Node, pnpm, and Bun if relevant.
      placeholder: oxlint-plugin-legibility 0.3.5, Oxlint 1.x, Node 26.x, pnpm 11.x with Nub
    validations:
      required: true
