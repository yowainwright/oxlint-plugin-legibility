name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and Nub
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release version and resolve npm dist-tag
        id: dist-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          CORE='(0|[1-9][0-9]*)'
          PRE='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          SEMVER="^${CORE}\.${CORE}\.${CORE}(-${PRE}(\.${PRE})*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [[ ! "$VERSION" =~ $SEMVER || "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Release tag must be an exact semantic version matching package.json" >&2
            exit 1
          fi
          if [[ "$VERSION" =~ -(alpha|beta|rc) ]]; then
            echo "tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Use npm with OIDC support
        run: npm install -g npm@12.0.1
      - run: nub install --frozen-lockfile
      - run: nub run validate
      - name: Pack npm tarball
        id: pack
        run: |
          mkdir -p ./npm-release-assets
          npm pack --ignore-scripts --json --pack-destination ./npm-release-assets > npm-pack.json
          TARBALL="$(nub --node scripts/repo/index.ts parse-pack-output npm-pack.json)"
          test -n "$TARBALL"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
      - name: Verify npm tarball boundary
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          invalid=0
          while IFS= read -r entry; do
            case "$entry" in
              package/|package/bin/*|package/dist/*|package/skills/*|package/LICENSE|package/README.md|package/package.json) ;;
              *) echo "Unexpected package entry: $entry" >&2; invalid=1 ;;
            esac
          done < <(tar -tzf "$TARBALL")
          test "$invalid" -eq 0
      - name: Attest npm tarball
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - name: Prepare release attestation
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          SIGSTORE_BUNDLE="$TARBALL.sigstore.json"
          cp "$BUNDLE_PATH" "$SIGSTORE_BUNDLE"
      - name: Upload release assets for the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-assets
          path: ./npm-release-assets
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - name: Remove npm token fallback
        run: npm config delete "//registry.npmjs.org/:_authToken"
      - name: Publish npm package
        env:
          PACKAGE_NAME: oxlint-plugin-legibility
          PACKAGE_VERSION: ${{ github.ref_name }}
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          VERSION="${PACKAGE_VERSION#v}"
          if npm view "$PACKAGE_NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already published; verifying the existing artifact"
          else
            npm publish "$TARBALL" --access public --tag "$DIST_TAG"
          fi
      - name: Verify npm registry integrity
        env:
          PACKAGE_NAME: oxlint-plugin-legibility
          PACKAGE_VERSION: ${{ github.ref_name }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          VERSION="${PACKAGE_VERSION#v}"
          LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          REGISTRY_INTEGRITY="$(npm view "$PACKAGE_NAME@$VERSION" dist.integrity)"
          test "$LOCAL_INTEGRITY" = "$REGISTRY_INTEGRITY"

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-assets
          path: ./npm-release-assets
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          TARBALL="$(find ./npm-release-assets -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          SIGSTORE_BUNDLE="$TARBALL.sigstore.json"
          test -f "$SIGSTORE_BUNDLE"
          RELEASE_ARGS=()
          if [[ "$VERSION" =~ -(alpha|beta|rc) ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          if gh release view "$VERSION" > /dev/null 2>&1; then
            existing_assets="$(gh release view "$VERSION" --json assets --jq '.assets[].name')"
            mkdir -p ./release-asset-verification
            for asset in "$TARBALL" "$SIGSTORE_BUNDLE"; do
              asset_name="$(basename "$asset")"
              if printf '%s\n' "$existing_assets" | grep -Fqx "$asset_name"; then
                gh release download "$VERSION" --pattern "$asset_name" --dir ./release-asset-verification
                cmp -- "$asset" "./release-asset-verification/$asset_name"
                continue
              fi
              gh release upload "$VERSION" "$asset"
            done
            exit 0
          fi

          gh release create "$VERSION" "$TARBALL" "$SIGSTORE_BUNDLE" \
            --title "$VERSION" \
            --generate-notes \
            "${RELEASE_ARGS[@]}"
