name: Test Published Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Published oxlint-plugin-legibility version to test (leave empty for latest on npm)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-published-release:
    runs-on: ubuntu-latest
    name: pnpm smoke

    steps:
      - name: Setup Node.js and Nub
        uses: nubjs/setup-nub@47e5e7393d50f4e9544ddaf756aa277972afba2d # v0.4.0
        with:
          node-version: 26
          cache: false

      - name: Determine version to test
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(npm view oxlint-plugin-legibility version)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Testing oxlint-plugin-legibility@$VERSION"

      - name: Wait for npm package availability
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Waiting for oxlint-plugin-legibility@$VERSION to be available on npm..."
          for attempt in {1..30}; do
            if npm view "oxlint-plugin-legibility@$VERSION" version >/dev/null 2>&1; then
              echo "oxlint-plugin-legibility@$VERSION is available on npm"
              exit 0
            fi
            echo "Attempt $attempt/30: package not available yet, waiting 30 seconds..."
            sleep 30
          done
          echo "oxlint-plugin-legibility@$VERSION was not available on npm in time"
          exit 1

      - name: Install published package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release-smoke
          cd release-smoke
          printf '{"private":true,"type":"commonjs","packageManager":"pnpm@11.21.0"}\n' > package.json
          nub add -D oxlint "oxlint-plugin-legibility@$VERSION"

      - name: Verify package loading
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd release-smoke
          node -e 'const plugin = require("oxlint-plugin-legibility"); if (plugin.meta.name !== "oxlint-plugin-legibility") throw new Error("Unexpected plugin name"); if (plugin.meta.version !== process.env.VERSION) throw new Error("Unexpected plugin version: " + plugin.meta.version);'

      - name: Verify Oxlint plugin loading
        run: |
          cd release-smoke
          cat > oxlint.config.json <<'EOF'
          {
            "jsPlugins": [
              {
                "name": "legibility",
                "specifier": "oxlint-plugin-legibility"
              }
            ],
            "rules": {
              "legibility/prefer-early-return": "error"
            }
          }
          EOF
          cat > oxlint-bad.js <<'EOF'
          function save(failed) {
            if (failed) {
              return;
            } else {
              run();
            }
          }
          EOF

          set +e
          nubx oxlint --config oxlint.config.json oxlint-bad.js > oxlint.log 2>&1
          status=$?
          set -e
          cat oxlint.log
          test "$status" -ne 0
          grep -Eq "legibility(/|\\()prefer-early-return" oxlint.log

      - name: Report test result
        run: |
          echo "Tested oxlint-plugin-legibility@${{ steps.version.outputs.version }}"
          echo "Package manager: pnpm via Nub"
          echo "Oxlint published-package smoke test passed"
